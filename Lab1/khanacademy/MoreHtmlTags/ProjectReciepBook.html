<!DOCTYPE html>
<html>
<head>
    <title>Spin-off of "Project: Recipe book"</title>
    <meta charset="utf-8">
    <style>
        body {
            background-color: #fff8ee;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #8b0000;
        }

        h2 {
            color: #b22222;
        }

        table {
            border-collapse: collapse;
            width: 50%;
        }

        th, td {
            border: 1px solid #444;
            padding: 6px;
        }

        th {
            background-color: #f4a460;
        }
    </style>
</head>

<body>

    <h1>Dinara's Recipe Book</h1>

    <h2>Contents:</h2>
    <ol>
        <li><a href="#pizza">Pizza</a></li>
    </ol>

    <!-- RECIPE 1 -->
    <h2 id="pizza">Pizza</h2>

    <ul>
        <li>Time: 30 minutes</li>
        <li>Serves: 2 people</li>
    </ul>

    <table>
        <thead>
            <tr>
                <th>Ingredients</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Flour</td>
                <td>2 cups</td>
            </tr>
            <tr>
                <td>Cheese</td>
                <td>150 g</td>
            </tr>
            <tr>
                <td>Tomato sauce</td>
                <td>1 cup</td>
            </tr>
        </tbody>
    </table>

    <p><strong>Step 1:</strong> Mix the dough and let it rest.</p>
    <p><strong>Step 2:</strong> Add sauce and cheese.</p>
    <p><strong>Step 3:</strong> Bake in the oven for 15 minutes.</p>

    <p>
        <em>Source:
            <a href="https://en.wikipedia.org/wiki/Pizza" target="_blank">
                Wikipedia
            </a>
        </em>
    </p>

</body>
