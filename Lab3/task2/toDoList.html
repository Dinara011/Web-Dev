<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        .navbar {
            background-color: #1f1f1f; 
            color: #888;
            padding: 15px 0;
            width: 100%;
            margin-bottom: 40px;
        }

        .navbar-content {
            max-width: 800px;
            margin: 0 auto;
            padding-left: 15px;
            font-size: 18px;
        }

        
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            font-weight: 400;
            font-size: 36px;
            margin-bottom: 30px;
            color: #333;
        }

        
        .input-group {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
        }

        #taskInput {
            flex-grow: 1;
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            color: #777;
        }

        #taskInput::placeholder {
            color: #ccc;
        }

        
        #addBtn {
            background-color: #507eb4;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        #addBtn:hover {
            opacity: 0.9;
        }

        
        .todo-container {
            display:grid;
            grid-template-columns: 1fr 1fr ;
            gap:15px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fff;

        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        
        .todo-item:last-child {
            border-bottom: none;
        }

        
        .todo-item input[type="checkbox"] {
            transform: scale(1.2);
            margin-right: 20px;
            cursor: pointer;
            accent-color: #4a90e2; 
        }

        .task-text {
            flex-grow: 1;
            font-size: 16px;
            color: #333;
        }

        
        .completed {
            text-decoration: line-through;
            color: #333; 
        }

        
        .delete-btn {
            background: none;
            border: none;
            color: #dc3545; 
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }

        .delete-btn:hover {
            color: #b02a37;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="navbar-content">ToDo List</div>
    </div>

    <div class="container">
        <h1>ToDo List</h1>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="New Task">
            <button id="addBtn">Add</button>
        </div>

        <div class="todo-container" id="taskList">
            </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');


        

        function createTaskElement(text, isCompleted = false) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'todo-item';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = isCompleted;
            
            const span = document.createElement('span');
            span.className = 'task-text';
            span.textContent = text;
            if (isCompleted) {
                span.classList.add('completed');
            }

            
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    span.classList.add('completed');
                } else {
                    span.classList.remove('completed');
                }
            });

            
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>'; 
            
            
            delBtn.addEventListener('click', function() {
                taskList.removeChild(itemDiv);
            
            });

            
            itemDiv.appendChild(checkbox);
            itemDiv.appendChild(span);
            itemDiv.appendChild(delBtn);

            taskList.appendChild(itemDiv);
        }

        
        addBtn.addEventListener('click', () => {
            const text = taskInput.value.trim();
            if (text !== "") {
                createTaskElement(text);
                taskInput.value = ""; 
            }
           
        });

        
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addBtn.click();
            }
        });

        
    </script>
</body>
</html>
