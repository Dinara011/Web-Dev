<body>
<script>
	'use strict';
	let a = prompt("Login : ");
	if (a == "Admin"){
		let p = prompt("Password: ");
		if (p === "" || p = null ){
			alert("Отменено");
		}
		else if (p === 'Я Главный'){
            alert("Здраствуйте!");
		}
		else{
			alert("Неверный пароль");
		}
	}
	else if (a==='' || a === null){
		alert('Отменено');
	}
	else{
        alert('Я вас не знаю');
	}
</script>
</body>
