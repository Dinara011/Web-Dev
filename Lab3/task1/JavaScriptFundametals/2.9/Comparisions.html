<<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Comparisons</title>
</head>
<body>
<script>
	'use strict';
	alert(5 > 4);//true
	alert("ананас" > "яблоко");//false
	alert("2" > "12");//true
	alert(undefined === null);//false
	alert(undefined == null);//true
	alert(null == "\n0\n");//false
	alert(+null ==="\n0\n");//false

</script>
</body>
</html>
