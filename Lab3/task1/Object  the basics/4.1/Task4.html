<script>
	'use strict';
	 let menu = {
	 	width : 200,
	 	height : 300,
	 	title : "My menu"
	 };
	 function multiplyNUmerirc(obj){
	 	for (let key in obj){
	 		if ( typeof obj[key] == 'number'){
	 			obj[key]*=2;
	 		}
	 	}
	 }
	 multiplyNUmerirc (menu);
	 // после вызова функции
	 menu = {
	 	width : 400,
	 	height : 600,
	 	title : "My menu"
	 };
</script>
