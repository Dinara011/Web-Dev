<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facebook – вход или регистрация</title>
    <link rel="stylesheet" href="styles/Facebookss.css">
</head>
<body>
    <div class="main-container">
        <div class="left-content">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/Facebook_Logo_%282019%29.svg/1280px-Facebook_Logo_%282019%29.svg.png" alt="Facebook" class="fb-logo">
            <p><br>Facebook помогает вам всегда оставаться на связи и общаться со своими знакомыми.</p>
        </div>

        <div class="right-content">
            <div class="login-card">
                <form>
                    <input type="text" placeholder="Электронный адрес или номер телефона">
                    <input type="password" placeholder="Пароль">
                    <button type="submit" class="login-btn">Вход</button>
                </form>
                <a href="#" class="forgot-link">Забыли пароль?</a>
                <div class="divider"></div>
                <div class="create-box">
                    <a href="#" class="create-btn">Создать новый аккаунт</a>
                </div>
            </div>
            <p class="footer-text"><b>Создать Страницу</b> знаменитости, музыкальной группы или компании.</p>
        </div>
    </div>
</body>
</html>
