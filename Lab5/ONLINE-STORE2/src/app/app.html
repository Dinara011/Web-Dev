 <div class="app-container">
  <header class="header">
    <img src="https://kaspi.kz/img/main_logo.svg" alt="Kaspi.kz" class="kaspi-logo">
  </header>
  
  <main class="main-content">
    <div class="category-tabs">
      <button 
        *ngFor="let cat of categories" 
        [class.active]="selectedCategory?.id === cat.id"
        (click)="selectCategory(cat)">
        {{ cat.name }}
      </button>
    </div>

    <div *ngIf="selectedCategory; else prompt">
      <h2 class="category-title">{{ selectedCategory.name }}</h2>
      <app-product-list [products]="filteredProducts"></app-product-list>
    </div>

    <ng-template #prompt>
      <div class="welcome-banner">
        <span class="welcome-icon">🛍️</span>
        <h2>Дүкенге қош келдіңіз!</h2>
        <p>Тауарларды көру үшін жоғарыдағы категориялардың бірін таңдаңыз.</p>
      </div>
    </ng-template>
  </main>
</div>
